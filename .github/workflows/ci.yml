name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Kotlin Multiplatform core
        run: ./gradlew :core:allTests --no-configuration-cache

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter wrapper
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze
